name: Release

# Push a tag like v1.2.0 to build the linux tarballs, attach them to a
# GitHub Release, and publish a multi-arch image to ghcr.io.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  tarballs:
    if: github.repository == 'virlatinus/UrSchema-Community'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - run: pnpm install --frozen-lockfile
        working-directory: www
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: make package
        working-directory: backend
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            backend/build/linux-amd64/urschema-linux-amd64.tar.gz \
            backend/build/linux-arm64/urschema-linux-arm64.tar.gz \
            --title "$GITHUB_REF_NAME" --generate-notes

  image:
    if: github.repository == 'virlatinus/UrSchema-Community'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/virlatinus/urschema-community
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
