# Copy to compose.yaml, create the two secret files, then: docker compose up -d
#
#   openssl rand -base64 24 > urschema_password.txt   # your login password
#   openssl rand -hex 32    > urschema_key.txt        # encrypts saved connections
#   chmod 644 urschema_*.txt                          # the container runs as uid 10001
#
# Keep both files out of version control and out of the data volume's backups:
# with the key stored apart, a copy of the volume alone can't decrypt the
# saved database credentials.
services:
  urschema:
    image: ghcr.io/virlatinus/urschema-community:latest
    # build: .            # or build from this checkout
    restart: unless-stopped
    ports:
      # Drop "127.0.0.1:" to expose it on the network (ideally behind TLS)
      - "127.0.0.1:8080:8080"
    environment:
      URSCHEMA_PASSWORD_FILE: /run/secrets/urschema_password
      DB_ENCRYPTION_KEY_FILE: /run/secrets/urschema_key
      # URSCHEMA_READ_ONLY: "true"
      # URSCHEMA_TLS_CERT: /certs/cert.pem
      # URSCHEMA_TLS_KEY: /certs/key.pem
      # Behind a reverse proxy at https://example.com/db-admin/ (see README):
      # URSCHEMA_BASE_PATH: /db-admin
      # URSCHEMA_TRUSTED_PROXIES: 172.16.0.0/12
      # URSCHEMA_CONNECTIONS_FILE: /config/connections.json
    secrets:
      - urschema_password
      - urschema_key
    volumes:
      - urschema-data:/opt/urschema/data
      # - ./certs:/certs:ro

secrets:
  urschema_password:
    file: ./urschema_password.txt
  urschema_key:
    file: ./urschema_key.txt

volumes:
  urschema-data:
